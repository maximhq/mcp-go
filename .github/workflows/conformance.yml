name: MCP conformance

on:
  pull_request:
    paths:
      - '**/*.go'
      - '.github/workflows/conformance.yml'
      - 'conformance/**'
      - 'examples/conformance/**'
      - 'go.mod'
      - 'go.sum'
      - 'scripts/check_conformance.py'
  push:
    branches: [main]
    paths:
      - '**/*.go'
      - '.github/workflows/conformance.yml'
      - 'conformance/**'
      - 'examples/conformance/**'
      - 'go.mod'
      - 'go.sum'
      - 'scripts/check_conformance.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  server:
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Test conformance checker
        run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - name: Start conformance fixture server
        run: |
          go run ./examples/conformance > /tmp/mcp-conformance-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:3000/health >/dev/null; then
              break
            fi
            if [ "$attempt" -eq 60 ]; then
              cat /tmp/mcp-conformance-server.log
              exit 1
            fi
            sleep 1
          done
          python3 scripts/check_conformance.py \
            --url http://127.0.0.1:3000/mcp \
            --baseline conformance/server/expected-failures.yml
